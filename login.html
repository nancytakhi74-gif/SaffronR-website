<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Saffron Restaurant</title>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<main class="auth-wrapper">
<section class="auth-card">
<a class="brand" href="login.html"><span class="brand-icon"><i class="fa-solid fa-utensils"></i></span><span>Saffron Restaurant</span></a>
<div class="auth-heading">
<p class="eyebrow">WELCOME</p>
<h1 id="form-title">Login to your account</h1>
<p id="form-subtitle">Enter your details to continue to Saffron Restaurant.</p>
</div>
<div class="tabs">
<button type="button" class="tab active" id="login-tab">Login</button>
<button type="button" class="tab" id="signup-tab">Sign Up</button>
</div>
<form id="login-form" class="auth-form">
<label for="login-email">Email address</label>
<div class="input-wrap"><i class="fa-regular fa-envelope"></i><input type="email" id="login-email" placeholder="Enter your email" required></div>
<label for="login-password">Password</label>
<div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="login-password" placeholder="Enter your password" required><button type="button" class="show-password" data-target="login-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
<button type="submit" class="submit-btn">Login <i class="fa-solid fa-arrow-right"></i></button>
<p class="form-message" id="login-message" aria-live="polite"></p>
<p class="switch-text">Don't have an account? <button type="button" id="go-signup">Sign up</button></p>
</form>
<form id="signup-form" class="auth-form hidden">
<label for="signup-name">Full name</label>
<div class="input-wrap"><i class="fa-regular fa-user"></i><input type="text" id="signup-name" placeholder="Enter your name" required></div>
<label for="signup-email">Email address</label>
<div class="input-wrap"><i class="fa-regular fa-envelope"></i><input type="email" id="signup-email" placeholder="Enter your email" required></div>
<label for="signup-password">Create password</label>
<div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="signup-password" minlength="6" placeholder="At least 6 characters" required><button type="button" class="show-password" data-target="signup-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
<label for="confirm-password">Confirm password</label>
<div class="input-wrap"><i class="fa-solid fa-shield-halved"></i><input type="password" id="confirm-password" minlength="6" placeholder="Re-enter password" required></div>
<button type="submit" class="submit-btn">Create Account <i class="fa-solid fa-arrow-right"></i></button>
<p class="form-message" id="signup-message" aria-live="polite"></p>
<p class="switch-text">Already have an account? <button type="button" id="go-login">Login</button></p>
</form>
<p class="demo-note"><i class="fa-solid fa-circle-info"></i> Student demo: account details are saved in this browser only.</p>
</section>
</main>
<script src="login.js"></script>
</body>
</html>
